backend:
  name: git-gateway
  branch: main

# Cette ligne évite d'avoir à passer par GitHub directement :
# l'authentification se fait via Netlify Identity (voir les instructions).
local_backend: false

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "contenu"
    label: "Contenu de la page"
    files:
      - file: "data/site.json"
        label: "Textes et photos du site"
        name: "site"
        fields:
          - label: "Bandeau d'accueil"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Petit texte au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Titre principal", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }

          - label: "Section \"Le lieu\""
            name: "lieu"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte de présentation", name: "text", widget: "text" }
              - label: "Points forts (liste à puces)"
                name: "features"
                widget: "list"
                field: { label: "Point fort", name: "value", widget: "string" }
              - label: "Photos du carrousel"
                name: "photos"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image", required: false, hint: "Laisse vide pour garder le fond de couleur en attendant la vraie photo." }
                  - { label: "Légende (facultatif)", name: "caption", widget: "string", required: false }

          - label: "Section \"Activités\" (les 6 cartes)"
            name: "activites"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Pour MODIFIER une carte existante : clique sur son titre dans la liste ci-dessous pour la déplier, édite les champs, puis remonte tout en haut de la page et clique sur le bouton \"Enregistrer\"/\"Publier\". Pour en ajouter une : bouton \"Ajouter Activités\" en bas de la liste. Pour en supprimer : icône corbeille sur la carte."
            fields:
              - { label: "Titre de l'activité", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }

          - label: "Section \"Les occupantes\""
            name: "fondatrices"
            widget: "object"
            fields:
              - { label: "Texte d'introduction", name: "intro", widget: "text" }
              - label: "Coleen Group (Julie)"
                name: "coleen"
                widget: "object"
                fields:
                  - { label: "Photo de Julie", name: "photo", widget: "image", required: false }
                  - { label: "Mots-clés (ex: Formation · Bilan · Innovation)", name: "tag", widget: "string" }
                  - { label: "Rôle / accroche", name: "role", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
                  - { label: "Lien Instagram", name: "instagram", widget: "string", required: false }
                  - { label: "Lien Facebook", name: "facebook", widget: "string", required: false }
                  - { label: "Lien LinkedIn", name: "linkedin", widget: "string", required: false }
                  - { label: "Lien vers le site coleengroup.fr", name: "link", widget: "string" }
              - label: "Bizz de Femmes (Lolita)"
                name: "bizz"
                widget: "object"
                fields:
                  - { label: "Photo de Lolita", name: "photo", widget: "image", required: false }
                  - { label: "Mots-clés (ex: Consulting · Coaching · Formation)", name: "tag", widget: "string" }
                  - { label: "Rôle / accroche", name: "role", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
                  - { label: "Lien Instagram", name: "instagram", widget: "string", required: false }
                  - { label: "Lien Facebook", name: "facebook", widget: "string", required: false }
                  - { label: "Lien LinkedIn", name: "linkedin", widget: "string", required: false }
                  - { label: "Lien vers le site lolitaghilione.fr", name: "link", widget: "string" }

          - label: "Section \"Calendrier\""
            name: "calendrier"
            widget: "object"
            fields:
              - { label: "Texte d'introduction (au-dessus des événements)", name: "intro", widget: "text" }

          - label: "Section \"Disposer de l'espace\""
            name: "privatisation"
            widget: "object"
            fields:
              - { label: "Texte de présentation", name: "text", widget: "text" }
              - { label: "Ligne de capacité d'accueil", name: "capacity", widget: "string" }
              - { label: "Tarif demi-journée", name: "half_day_price", widget: "string", hint: "Appliqué au matin (9h-13h) et à l'après-midi (14h-18h)." }
              - { label: "Tarif journée complète", name: "full_day_price", widget: "string" }
              - { label: "Tarif soirée", name: "evening_price", widget: "string" }

          - label: "Pied de page"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Phrase d'introduction", name: "tagline", widget: "text" }
              - { label: "Adresse - ligne 1", name: "address_line1", widget: "string" }
              - { label: "Adresse - ligne 2", name: "address_line2", widget: "string" }
              - { label: "Adresse - ligne 3", name: "address_line3", widget: "string" }
              - { label: "Email Julie", name: "coleen_email", widget: "string" }
              - { label: "Téléphone Julie", name: "coleen_phone", widget: "string" }
              - { label: "Email Lolita", name: "bizz_email", widget: "string" }
              - { label: "Téléphone Lolita", name: "bizz_phone", widget: "string" }
              - { label: "Instagram de L'Entre-Elles", name: "instagram", widget: "string", required: false }
              - { label: "Facebook de L'Entre-Elles", name: "facebook", widget: "string", required: false }
              - { label: "LinkedIn de L'Entre-Elles", name: "linkedin", widget: "string", required: false }

          - label: "Mentions légales"
            name: "mentions_legales"
            widget: "object"
            hint: "Cette page devient une vraie association déclarée : reviens compléter le numéro RNA et le nom du/de la représentant·e légal·e dès que les statuts sont déposés."
            fields:
              - { label: "Forme juridique", name: "forme_juridique", widget: "string", default: "Association loi 1901 en cours de constitution" }
              - { label: "Numéro RNA", name: "rna", widget: "string", required: false, hint: "Laisse vide si pas encore attribué." }
              - { label: "Numéro SIRET (le cas échéant)", name: "siret", widget: "string", required: false }
              - { label: "Nom du/de la représentant·e légal·e", name: "representant", widget: "string", required: false }
              - { label: "Crédits (conception du site)", name: "credits", widget: "string", required: false }

  - name: "evenements"
    label: "Calendrier des événements"
    files:
      - file: "data/events.json"
        label: "Événements"
        name: "events"
        fields:
          - label: "Événements"
            name: "events"
            widget: "list"
            summary: "{{fields.start_date}} — {{fields.title}}"
            fields:
              - { label: "Titre de l'événement", name: "title", widget: "string" }
              - { label: "Date de début", name: "start_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
              - { label: "Date de fin", name: "end_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true, hint: "Identique à la date de début pour un événement d'un seul jour." }
              - { label: "Heure de début", name: "start_time", widget: "string", hint: "Format 09:00" }
              - { label: "Heure de fin", name: "end_time", widget: "string", hint: "Format 17:00" }
              - label: "Catégories de l'événement"
                name: "categories"
                widget: "relation"
                collection: "event_categories"
                search_fields: ["name"]
                value_field: "{{slug}}"
                display_fields: ["name"]
                multiple: true
                required: false
                hint: "Choisis une ou plusieurs catégories existantes, ou crée-en une nouvelle via l'onglet \"Catégories d'événements\" si besoin."
              - label: "Tarif"
                name: "price_type"
                widget: "select"
                options:
                  - { label: "Montant précis", value: "amount" }
                  - { label: "Gratuit", value: "free" }
                  - { label: "Sur devis", value: "quote" }
              - { label: "Montant (si \"Montant précis\" choisi ci-dessus)", name: "price_amount", widget: "string", required: false, hint: "Ex: 35 €" }
              - { label: "Financement possible (OPCO, CPF...)", name: "funding_available", widget: "boolean", default: false }
              - { label: "Description (affichée au survol de la carte)", name: "description", widget: "text", required: false }
              - label: "Type d'événement"
                name: "organized_by"
                widget: "select"
                default: "entre_elles"
                options:
                  - { label: "Organisé par L'Entre-Elles", value: "entre_elles" }
                  - { label: "Organisé par L'Entre-Elles en partenariat avec une autre structure", value: "partenariat" }
                  - { label: "Organisé par une intervenante qui loue l'espace", value: "intervenante" }
              - { label: "Nom de la structure partenaire", name: "partner_name", widget: "string", required: false, hint: "Rempli uniquement si \"En partenariat avec une autre structure\" est choisi ci-dessus. Ex: Synergie Féminine → affichera \"Proposé par L'Entre-Elles × Synergie Féminine\"." }
              - label: "Si organisé par L'Entre-Elles : par qui ?"
                name: "founders_organizers"
                widget: "select"
                multiple: true
                required: false
                options:
                  - { label: "Julie (Coleen Group)", value: "Coleen Group" }
                  - { label: "Lolita (Bizz de Femmes)", value: "Bizz de Femmes" }
                hint: "Laisse vide si le type ci-dessus est \"Organisé par une intervenante\"."
              - label: "Intervenantes / organisatrices de la Communauté"
                name: "organizers"
                widget: "relation"
                collection: "membres"
                search_fields: ["prenom", "nom"]
                value_field: "{{slug}}"
                display_fields: ["prenom", "nom"]
                multiple: true
                required: false
                hint: "Choisis une ou plusieurs fiches déjà créées dans \"Communauté\". Si l'intervenante n'a pas encore de fiche, crée-la d'abord dans l'onglet Communauté."
              - label: "Réservation"
                name: "reservation_type"
                widget: "select"
                default: "lien"
                options:
                  - { label: "Lien de réservation", value: "lien" }
                  - { label: "Réservable prochainement (billetterie pas encore prête)", value: "a_venir" }
                  - { label: "Réservable par téléphone ou email", value: "contact" }
              - { label: "Lien de réservation", name: "link", widget: "string", required: false, hint: "Rempli uniquement si \"Lien de réservation\" est choisi ci-dessus." }
              - { label: "Téléphone ou email de réservation", name: "reservation_contact", widget: "string", required: false, hint: "Rempli uniquement si \"Réservable par téléphone ou email\" est choisi ci-dessus. Ex: 06 12 34 56 78 ou contact@exemple.fr" }

  - name: "membres"
    label: "Communauté"
    folder: "data/members"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "nom"
    summary: "{{prenom}} {{nom}}"
    fields:
      - { label: "Prénom", name: "prenom", widget: "string" }
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Titre (métier / activité)", name: "titre", widget: "string", hint: "Ex: Coach en neuromarketing, Fondatrice de AIO Studio..." }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Lien Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Lien Facebook", name: "facebook", widget: "string", required: false }
      - { label: "Lien LinkedIn", name: "linkedin", widget: "string", required: false }
      - { label: "Site internet", name: "website", widget: "string", required: false }
      - label: "Ville(s)"
        name: "villes"
        widget: "list"
        field: { label: "Ville", name: "value", widget: "string" }
        required: false
        hint: "Ajoute une ou plusieurs villes où elle exerce (ex: Toulon, La Seyne-sur-Mer)."
      - label: "Catégorie/Métier"
        name: "mots_cles"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        multiple: true
        required: false
        hint: "Choisis une ou plusieurs catégories existantes, ou crée-en une nouvelle directement depuis ce champ (tape le nom puis valide) — elle sera automatiquement disponible pour toutes les autres fiches."
      - label: "Besoins sur lesquels elle peut aider"
        name: "besoins"
        widget: "relation"
        collection: "besoins"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        multiple: true
        required: false
        hint: "Choisis un ou plusieurs besoins existants, ou crée-en un nouveau directement depuis ce champ."
      - { label: "Est intervenante", name: "is_speaker", widget: "boolean", default: false, hint: "Si coché, et qu'un événement du calendrier la cite comme intervenante, sa prochaine intervention s'affichera automatiquement sur sa fiche." }

  - name: "categories"
    label: "Catégorie/Métier"
    folder: "data/categories"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}}"
    fields:
      - { label: "Nom de la catégorie", name: "name", widget: "string" }

  - name: "besoins"
    label: "Besoins"
    folder: "data/besoins"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}}"
    fields:
      - { label: "Nom du besoin", name: "name", widget: "string" }

  - name: "event_categories"
    label: "Catégories d'événements"
    folder: "data/event_categories"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}}"
    fields:
      - { label: "Nom de la catégorie", name: "name", widget: "string" }
